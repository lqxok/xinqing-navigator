        desc: 在任何模型、知识库或状态机处理前隐藏常见个人标识符。
        selected: false
        code: "import re\n\ndef main(query: str) -> dict:\n    text = str(query or \"\")\n    patterns = [\n        r\"(?<!\\d)1[3-9]\\d{9}(?!\\d)\",\n        r\"(?<!\\d)[1-9]\\d{5}(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])\\d{3}[0-9Xx](?!\\w)\",\n        r\"(?i)(?<![A-Z0-9._%+-])[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}(?![A-Z0-9_])\",\n        r\"(?:学号|工号)\\s*[:：是为]?\\s*[A-Za-z0-9_-]{6,24}\",\n        r\"(?:身份证号?|身份证号码)\\s*[:：是为]?\\s*[0-9Xx-]{8,24}\",\n        r\"(?:手机号|手机号码|联系电话|电话号码)\\s*[:：是为]?\\s*[0-9+ -]{7,20}\",\n        r\"(?:QQ号?|微信号|账号|密码|验证码)\\s*[:：是为]?\\s*[A-Za-z0-9_@.-]{4,40}\",\n    ]\n    redacted = text\n    for pattern in patterns:\n        redacted = re.sub(pattern, \"[已隐藏个人信息]\", redacted)\n    return {\"text\": redacted, \"had_pii\": \"1\" if redacted != text else \"0\"}\n"
