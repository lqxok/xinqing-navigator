  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 50
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '你好，我是华农心晴导航——校园心理支持AI助手（不是真人心理老师，不能替代心理咨询师或医生）。


      你可以和我做这些事：

      · 聊聊最近的压力、情绪，或学业、人际上的困扰

      · 做 GAD-7 焦虑自测、性格偏好小游戏、快速心情打卡

      · 查询校园心理服务预约方式与心理老师公开信息


      隐私提示：请勿发送姓名、学号、身份证号、电话、住址等身份信息；对话内容可能按学校平台管理规则留存和处理。

      紧急情况请立即拨打 12356 心理援助热线或 120。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我最近考试压力很大，睡不着怎么办？
    - 帮我做一个焦虑自测（GAD-7）
    - 怎么预约学校的心理咨询？
    - 最近感觉很累，什么都不想做
    - 帮我查一下心理老师的信息
    - 我想做快速心情打卡
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
