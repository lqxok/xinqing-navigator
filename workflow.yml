    - data:
        code: "def main(query: str, step: str, answers: str) -> dict:\n    questions = [\n        \"你更喜欢 A.和很多人在一起 B.一个人待着\",\n        \"你更偏向 A.实际具体的事物 B.抽象概念和想法\",\n        \"做决定时你更依赖 A.逻辑和分析 B.感受和价值观\",\n        \"你更喜欢 A.有计划有安排 B.随性灵活\",\n        \"社交后你通常 A.精力充沛 B.需要独处充电\",\n        \"你更关注 A.眼前的细节 B.未来的可能性\",\n        \"你更看重 A.公平和道理 B.人情和和谐\",\n        \"你更喜欢 A.按计划行事 B.随时调整\",\n        \"你更倾向于 A.主动发起对话 B.等别人来找你\",\n        \"学习新东西时你喜欢 A.按步骤来 B.先看整体\",\n        \"批评别人时你更看重 A.分析问题在哪 B.考虑对方感受\",\n        \"你的桌面通常是 A.整齐有序 B.比较随意\",\n        \"你更喜欢 A.热闹的聚会 B.小范围的深入交流\",\n        \"你更相信 A.过往的经验 B.自己的直觉\",\n        \"你更欣赏 A.坦诚直接的表达 B.委婉温和的表达\",\n        \"你更喜欢 A.事情一件件做完 B.多件事情同时进行\",\n        \"你更倾向于 A.先想再说 B.边说边想\",\n        \"你更关注 A.事实和数据 B.故事和意义\",\n        \"发生冲突时你先想 A.谁对谁错 B.大家怎么想\",\n        \"你更喜欢 A.有明确截止日期 B.随时可变化的安排\",\n        \"认识新朋友时你 A.比较主动 B.比较被动\",\n        \"你更擅长 A.记住具体细节 B.把握整体印象\",\n        \"你更看重 A.事情的结果 B.过程中的感受\",\n        \"旅行时你更喜欢 A.提前规划好行程 B.到了再说\",\n    ]\n    q = (query or \"\").strip().upper().replace(\" \", \"\")\n    try:\n        current_step = int(step or \"0\")\n    except Exception:\n        current_step = 0\n    saved = [x for x in (answers or \"\").upper().split(\",\") if x in (\"A\", \"B\")]\n    if current_step < 0 or current_step > 24 or len(saved) != max(current_step - 1, 0):\n        current_step, saved = 0, []\n\n    if current_step == 0:\n        text = \"下面是24题性格偏好小游戏，不是专业人格测验或诊断。请按第一感觉回答A或B。\\n\\n第1/24题：\" + questions[0]\n        return {\"result\": text, \"step\": \"1\", \"answers\": \"\", \"status\": \"进行中\"}\n\n    if any(word in q for word in (\"重新开始\", \"从头开始\", \"重来\")):\n        return {\"result\": \"已重新开始性格偏好小游戏。\\n\\n第1/24题：\" + questions[0], \"step\": \"1\", \"answers\": \"\", \"status\": \"进行中\"}\n    if any(word in q for word in (\"退出\", \"取消\", \"不做了\", \"停止测试\", \"结束测试\")):\n        return {\"result\": \"好的，已退出本次性格偏好小游戏。\", \"step\": \"0\", \"answers\": \"\", \"status\": \"未开始\"}\n\n    if q in (\"查看答案\", \"查看已记录答案\", \"查看已记录的答案\"):\n        shown = \"、\".join(f\"第{i + 1}题={value}\" for i, value in enumerate(saved)) or \"暂时还没有已记录的答案\"\n        return {\"result\": f\"当前记录：{shown}。\\n\\n第{current_step}/24题：{questions[current_step - 1]}\", \"step\": str(current_step), \"answers\": \",\".join(saved), \"status\": \"进行中\"}\n\n    if q in (\"上一题\", \"返回上一题\", \"回到上一题\"):\n        if current_step == 1:\n            return {\"result\": \"现在已经是第1题。\\n\\n第1/24题：\" + questions[0], \"step\": \"1\", \"answers\": \"\", \"status\": \"进行中\"}\n        saved.pop()\n        previous_step = current_step - 1\n        return {\"result\": f\"已返回上一题，原答案已撤销。\\n\\n第{previous_step}/24题：{questions[previous_step - 1]}\", \"step\": str(previous_step), \"answers\": \",\".join(saved), \"status\": \"进行中\"}\n\n    change_value = None\n    for prefix in (\"上一题改成\", \"上一题改为\", \"上一题改\", \"把上一题改成\", \"把上一题改为\", \"把上一题改\"):\n        if q.startswith(prefix):\n            candidate = q[len(prefix):]\n            if candidate in (\"A\", \"B\"):\n                change_value = candidate\n            break\n    if change_value is not None:\n        if not saved:\n            return {\"result\": \"还没有上一题答案可以修改。\", \"step\": str(current_step), \"answers\": \",\".join(saved), \"status\": \"进行中\"}\n        saved[-1] = change_value\n        return {\"result\": f\"已把上一题改为 {change_value}。\\n\\n第{current_step}/24题：{questions[current_step - 1]}\", \"step\": str(current_step), \"answers\": \",\".join(saved), \"status\": \"进行中\"}\n\n    a_values = (\"A\", \"选A\", \"A。\", \"A.\", \"前者\", \"第一个\")\n    b_values = (\"B\", \"选B\", \"B。\", \"B.\", \"后者\", \"第二个\")\n    choice = \"A\" if q in a_values else \"B\" if q in b_values else \"\"\n    if not choice:\n        return {\"result\": f\"我还没识别出你的选择。第{current_step}/24题请只回复 A 或 B：\\n{questions[current_step - 1]}\", \"step\": str(current_step), \"answers\": \",\".join(saved), \"status\": \"进行中\"}\n\n    saved.append(choice)\n    if current_step < 24:\n        next_step = current_step + 1\n        return {\"result\": f\"已记录。\\n\\n第{next_step}/24题：{questions[next_step - 1]}\", \"step\": str(next_step), \"answers\": \",\".join(saved), \"status\": \"进行中\"}\n\n    def dimension(indices, a_letter, b_letter):\n        a_count = sum(1 for i in indices if saved[i] == \"A\")\n        return a_letter if a_count > 3 else b_letter if a_count < 3 else \"X\"\n    type_code = (\n        dimension((0, 4, 8, 12, 16, 20), \"E\", \"I\") +\n        dimension((1, 5, 9, 13, 17, 21), \"S\", \"N\") +\n        dimension((2, 6, 10, 14, 18, 22), \"T\", \"F\") +\n        dimension((3, 7, 11, 15, 19, 23), \"J\", \"P\")\n    )\n    descriptions = {\n        \"INTJ\": \"偏好独立思考、关注整体并按计划推进。\", \"INTP\": \"偏好探索原理、保持开放和灵活。\",\n        \"ENTJ\": \"偏好主动组织、关注目标和效率。\", \"ENTP\": \"偏好交流新想法并探索多种可能。\",\n        \"INFJ\": \"偏好深入理解他人，并以长远视角行动。\", \"INFP\": \"重视个人价值、想象力和内在感受。\",\n        \"ENFJ\": \"关注人与合作，常愿意主动支持他人。\", \"ENFP\": \"热衷新体验、人际互动和创意表达。\",\n        \"ISTJ\": \"偏好可靠、具体且有秩序的做事方式。\", \"ISFJ\": \"关注细节和他人需要，做事较为稳妥。\",\n        \"ESTJ\": \"偏好清晰规则、实际结果和组织执行。\", \"ESFJ\": \"重视关系和协作，常留意他人的感受。\",\n        \"ISTP\": \"偏好独立分析和处理现实中的具体问题。\", \"ISFP\": \"重视个人体验，通常温和且保持弹性。\",\n        \"ESTP\": \"偏好行动、现场应变和实际挑战。\", \"ESFP\": \"偏好互动与体验，容易关注当下氛围。\",\n    }\n    has_tie = \"X\" in type_code\n    desc = descriptions.get(type_code, \"部分维度较为均衡，没有明显偏向。\")\n    tie_note = \"（X表示该维度本次作答为3:3平分）\" if has_tie else \"\"\n    text = f\"你的结果偏向 {type_code}{tie_note}：{desc}\\n\\n这只是非专业的性格偏好小游戏，结果会受当下状态和题目设计影响，不宜用于诊断、选专业或重要决策。\"\n    return {\"result\": text, \"step\": \"0\", \"answers\": \"\", \"status\": \"已完成\"}"
