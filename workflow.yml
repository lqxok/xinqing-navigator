        selected: false
        answer: 我很重视你刚才说的内容。请先不要接近你想伤害的人，也不要携带或接触刀具、药物等可能造成伤害的物品；立刻离开冲突现场，联系一位可信任的成年人陪着你。如果你已经准备行动、手边有工具或有人正处于危险中，请立即拨打110；如有人受伤同时拨打120。你也可以联系12356或学校心理中心，直接说明自己有伤害他人的冲动。
        variables: []
    - data:
        code: "def main(query: str, current_time: str) -> dict:\n    query = str(query or \"\")\n    static_notice = \"静态资料，仅供方向参考，不代表当前在岗或可预约。\"\n    teachers = [\n        {\"name\": \"梁小伊\", \"title\": \"教授/国家二级心理咨询师\", \"specialty\": \"环境适应、压力应对、人际交往、职业规划、抑郁焦虑、情感障碍、异常心理、危机识别干预\"},\n        {\"name\": \"刘信洪\", \"title\": \"西南师大心理学硕士/清华教育博士\", \"specialty\": \"认知心理、精神分析、学业困惑、人际困惑、情感困惑\"},\n        {\"name\": \"王伍香\", \"title\": \"国家二级心理咨询师(2014)\", \"specialty\": \"各年龄段学生心理\"},\n        {\"name\": \"成华青\", \"title\": \"中山大学法学硕士/副教授/国家三级心理咨询师\", \"specialty\": \"个体成长、亲子关系\"},\n        {\"name\": \"陈巍\", \"title\": \"国家心理咨询师/职业指导师\", \"specialty\": \"生涯规划、人际交往、学业压力、情绪情感\"},\n        {\"name\": \"陈智欣\", \"title\": \"广州中医药大学七年制本硕中医学/国家二级心理咨询师\", \"specialty\": \"新生适应、亲密关系、情绪管理、自我成长\"},\n        {\"name\": \"马晓莉\", \"title\": \"国家二级心理咨询师\", \"specialty\": \"情绪情感、人际关系、家庭问题\"},\n        {\"name\": \"苏安梅\", \"title\": \"外语学院教师/13年教学/国家二级心理咨询师/正面管教讲师\", \"specialty\": \"自我成长、亲子关系、家庭关系、情绪管理\"},\n        {\"name\": \"陈坤钰\", \"title\": \"本科广外应用心理学/硕士华师应用心理学/国家二级心理咨询师\", \"specialty\": \"自我成长、人际关系、情绪管理\"},\n        {\"name\": \"李佳媛\", \"title\": \"国家三级心理咨询师/国家三级职业指导师\", \"specialty\": \"学习问题、人际关系、职业规划\"},\n        {\"name\": \"梁娟\", \"title\": \"本科河南师大心理学/硕士华师心理学/国家二级心理咨询师\", \"specialty\": \"自我成长、情绪情感、亲子关系、亲密关系\"},\n        {\"name\": \"石如彬\", \"title\": \"硕士华师心理学院/国家二级心理咨询师\", \"specialty\": \"生涯规划、人际交往、学业压力、情绪情感\"},\n        {\"name\": \"何凯\", \"title\": \"经管学院辅导员/国家二级心理咨询师/绘画心理分析师\", \"specialty\": \"辅导员支持视角\"},\n        {\"name\": \"严颖\", \"title\": \"数信学院辅导员/福建师大发展与教育心理学硕士/国家二级心理咨询师\", \"specialty\": \"新生适应、恋爱情感、人际关系、团体辅导\"},\n        {\"name\": \"叶昶\", \"title\": \"华南师大应用心理硕士\", \"specialty\": \"新生适应、情绪管理、人际关系、家庭问题\"},\n        {\"name\": \"陈丽冰\", \"title\": \"国家二级心理咨询师/国家二级职业指导师\", \"specialty\": \"个体成长、人际关系、职业规划\"},\n        {\"name\": \"叶晓燕\", \"title\": \"国家二级心理咨询师/初级心理治疗师\", \"specialty\": \"发展性咨询、情绪情感、人际关系、学习问题、异常心理识别\"},\n    ]\n\n    if any(kw in query for kw in ['男老师', '女老师', '男性咨询师', '女性咨询师']):\n        return {\"result\": \"当前公开资料没有经过核实的老师性别字段，我不能根据姓名推测。建议联系心理中心说明你的偏好，由工作人员在可选范围内协助匹配。\"}\n\n    booking_kw = ['预约', '怎么约', '如何预约', '预约流程', '预约方式', '线上预约', '公众号']\n    if any(kw in query for kw in booking_kw):\n        return {\"result\": \"你可以先查看‘华南农业大学心理中心’公众号的最新预约说明，或拨打 020-85280085 / 020-85283422 核实。地址、开放时间、预约入口和可约老师可能调整，我不使用项目内旧资料替代官方最新通知。\"}\n\n    if any(kw in query for kw in ['收费', '要钱', '免费', '费用']):\n        return {\"result\": \"根据当前项目资料，在校学生心理咨询通常免费；具体请以心理中心最新通知或预约时的说明为准。\"}\n\n    if any(kw in query for kw in ['保密', '辅导员', '泄露', '隐私']):\n        return {\"result\": \"心理咨询通常遵循保密原则，具体保密边界会在咨询前进行知情说明；如果存在危及本人或他人安全等情况，可能依法依规启动必要干预。建议预约时向心理中心确认现行规定。\"}\n\n    if any(kw in query for kw in ['电话', '地址', '在哪', '哪里', '几点', '时间', '开门']):\n        return {\"result\": \"学校心理热线为 020-85280085 或 020-85283422。当前地址和开放时间请通过‘华南农业大学心理中心’公众号或电话核实，我不想用可能过期的信息误导你。\"}\n\n    for t in teachers:\n        if t['name'] in query:\n            return {'result': f\"关于 {t['name']} 老师：\\n\\n{t['title']}\\n\\n擅长的方向是：{t['specialty']}\\n\\n静态资料，仅供方向参考，不代表当前在岗或可预约。 请拨打 020-85280085 向心理中心核实。\"}\n    match_kw = ['焦虑', '抑郁', '睡眠', '失眠', '人际', '情绪', '适应', '职业', '生涯', '学业', '压力', '家庭', '亲子', '情感', '恋爱', '成长', '危机', '胃口', '食欲', '饮食', '躯体', '身体', '焦躁', '躁', '狂躁', '躁郁']\n    for kw in match_kw:\n        if kw in query:\n            matched = [t for t in teachers if kw in t['specialty']]\n            if matched:\n                lines = [f\"{static_notice}\\n\\n根据项目内静态资料，你提到的「{kw}」方向可参考以下老师；名单和专长需由心理中心再次核实：\\n\"]\n                for m in matched[:3]:\n                    lines.append(f\"{m['name']} 老师 | {m['title']}\\n  擅长：{m['specialty']}\\n\")\n                lines.append(\"如需预约，请拨打 020-85280085，由心理中心按当前人员和时段匹配。\\n\")\n                return {\"result\": \"\".join(lines)}\n            else:\n                lines = [f\"{static_notice}\\n\\n你提到的「{kw}」这个方向，目前静态资料里没有完全匹配的老师。下面列出资料中的老师供方向参考：\\n\\n\"]\n                for i, t in enumerate(teachers, 1):\n                    lines.append(f\"{i}. {t['name']} 老师 | {t['title']} | {t['specialty']}\\n\")\n                lines.append(\"\\n建议打电话 020-85280085 说明你的需求，接线人员会帮你匹配最合适的老师。\\n\")\n                return {\"result\": \"\".join(lines)}\n\n    rec_kw = ['推荐', '适合', '合适', '擅长']\n    if any(kw in query for kw in rec_kw):\n        lines = [f\"{static_notice}\\n\\n以下是项目内静态老师资料，不代表当前完整名录或排班，请先作方向参考：\\n\\n\"]\n        for i, t in enumerate(teachers, 1):\n            lines.append(f\"{i}. {t['name']} 老师 | {t['title']} | {t['specialty']}\\n\")\n        lines.append(\"\\n如果想预约，打电话 020-85280085，接线人员会帮你匹配最合适的老师。\\n\")\n        return {\"result\": \"\".join(lines)}\n\n    list_kw = ['所有', '全部', '有哪些', '名录', '名单', '展示', '列出', '几个', '多少', '介绍', '咨询师']\n    if any(kw in query for kw in list_kw):\n        lines = [f\"{static_notice}\\n\\n项目内静态资料收录了17条老师信息，不代表当前完整名录或排班：\\n\\n\"]\n        for i, t in enumerate(teachers, 1):\n            lines.append(f\"{i}. {t['name']} 老师 | {t['title']} | {t['specialty']}\\n\")\n        lines.append(\"\\n名单、资质、专长和排班可能变化；请通过心理中心公众号或 020-85280085 核实后预约。\\n\")\n        return {\"result\": \"\".join(lines)}\n\n    return {\"result\": f\"{static_notice}\\n\\n关于心理老师，你想了解哪方面呢？我可以按静态资料介绍某位老师的方向、按问题提供方向参考，或者列出资料中的老师名单。\"}\n"
