        title: 模型前状态路由
        desc: 活动测评在模型前确定；明确请求另一项功能时直接切换
        selected: false
        code_language: python3
        code: "import re\n\ndef main(query: str, gad7_step: str, personality_step: str, light_step: str, risk_pending: str) -> dict:\n    q = str(query or \"\").strip()\n    compact = \"\".join(q.split()).replace(\"。\", \"\").replace(\"！\", \"\").replace(\"!\", \"\")\n    gad = str(gad7_step or \"0\") != \"0\"\n    personality = str(personality_step or \"0\") != \"0\"\n    light = str(light_step or \"0\") != \"0\"\n\n    safe_answers = {\"安全\", \"我安全\", \"现在安全\", \"目前安全\", \"能保证安全\", \"我能保证安全\"}\n    unsafe_answers = {\"不安全\", \"现在不安全\", \"目前不安全\", \"不能保证安全\", \"我不能保证安全\", \"控制不住\", \"有具体计划\"}\n    if compact in unsafe_answers:\n        return {\"route\": \"crisis_immediate\", \"reason\": \"explicit_unsafe_reply\"}\n    if compact in safe_answers and str(risk_pending or \"0\") == \"1\":\n        return {\"route\": \"crisis_safe\", \"reason\": \"pending_risk_confirmed_safe\"}\n\n    hard_terms = (\"想死\", \"自杀\", \"不想活\", \"伤害自己\", \"割腕\", \"跳楼\", \"吞药\", \"不安全\", \"结束生命\", \"轻生\", \"自残\", \"自伤\")\n    soft_terms = (\"撑不下去\", \"活着没意义\", \"活不下去\", \"没必要活着\", \"不想醒来\", \"想消失\", \"消失算了\", \"想解脱\", \"想永远睡过去\", \"结束这一切\", \"最后告别\")\n    violence_terms = (\"伤害别人\", \"伤害他人\", \"杀人\", \"杀了他\", \"杀了她\", \"弄死他\", \"弄死她\", \"砍人\", \"捅人\", \"报复他\", \"报复她\", \"打死他\", \"打死她\", \"对他动手\", \"对她动手\")\n    explicit_negations = (\"我不想死\", \"我不会自杀\", \"我没有自杀想法\", \"我没想过自杀\", \"我没想自杀\", \"我不会伤害自己\", \"我不想伤害自己\", \"我没这个想法\")\n    strong_self_evidence = (\"我控制不住伤害自己\", \"我已经割腕\", \"我已经吞药\", \"我已经吃了很多药\", \"我无法保证自己安全\", \"我控制不住\")\n    idiom_false_positives = (\"死磕\", \"死党\", \"死心\", \"死记硬背\", \"笑死\", \"累死\", \"烦死\", \"死板\", \"死机\", \"死循环\", \"无聊死\", \"拼死\", \"困死\", \"饿死\", \"气死\", \"尴尬死\", \"热死\", \"冷死\", \"死死\")\n    colloquial_phrases = (\"我要死了这作业\", \"这作业我要死了\", \"我要死了这考试\", \"这考试我要死了\")\n\n    q_scan = q\n    for phrase in colloquial_phrases:\n        q_scan = q_scan.replace(phrase, \"\")\n    for term in idiom_false_positives:\n        q_scan = q_scan.replace(term, \"\")\n\n    if any(term in q_scan for term in violence_terms):\n        return {\"route\": \"violence_risk\", \"reason\": \"threat_to_other_person\"}\n    q_wo_neg = q_scan\n    for term in explicit_negations:\n        q_wo_neg = q_wo_neg.replace(term, \"\")\n    residual_risk = any(term in q_wo_neg for term in hard_terms + soft_terms)\n    if any(term in q_scan for term in explicit_negations) and not any(term in q_scan for term in strong_self_evidence) and not residual_risk:\n        return {\"route\": \"normal\", \"reason\": \"explicit_self_risk_negation\"}\n    overdose = bool(re.search(r\"(?:吃|服|吞)(?:了)?[^，。！？!?]{0,12}(?:一整瓶|一把|很多|过量|[1-9]\\d+片)|(?:药吃多了|服药过量|吃药过量)\", q_scan))\n    implemented = overdose or any(term in q_scan for term in strong_self_evidence)\n    if implemented:\n        return {\"route\": \"crisis_immediate\", \"reason\": \"action_already_taken_or_uncontrolled\"}\n    if any(term in q_scan for term in hard_terms + soft_terms):\n        return {\"route\": \"crisis_soft\", \"reason\": \"risk_keyword_deterministic\"}\n\n    ordinary_medication = (\"我吃药了\", \"吃药了\", \"我在吃药\", \"我按医嘱吃药了\", \"刚吃完药\")\n    if compact in ordinary_medication:\n        return {\"route\": \"medication_clarify\", \"reason\": \"ambiguous_medication_statement\"}\n\n    wants_gad = any(term in q.upper() for term in (\"GAD\", \"焦虑自测\", \"焦虑测试\"))\n    wants_personality = any(term in q.upper() for term in (\"MBTI\", \"性格测试\", \"人格测试\", \"性格小游戏\"))\n    wants_light = any(term in q for term in (\"心情打卡\", \"快速打卡\", \"情绪打卡\"))\n    if wants_gad and not gad:\n        return {\"route\": \"gad7_test\", \"reason\": \"explicit_gad7_start_or_switch\"}\n    if wants_personality and not personality:\n        return {\"route\": \"personality_test\", \"reason\": \"explicit_personality_start_or_switch\"}\n    if wants_light and not light:\n        return {\"route\": \"light_assess\", \"reason\": \"explicit_light_start_or_switch\"}\n    if gad:\n        return {\"route\": \"gad7_test\", \"reason\": \"active_gad7_before_model\"}\n    if personality:\n        return {\"route\": \"personality_test\", \"reason\": \"active_personality_before_model\"}\n    if light:\n        return {\"route\": \"light_assess\", \"reason\": \"active_light_checkin_locked\"}\n    return {\"route\": \"normal\", \"reason\": \"model_classification_needed\"}\n"
        variables:
