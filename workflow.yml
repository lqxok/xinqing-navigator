        code: "import re\n\ndef main(query: str, files: list = None) -> dict:\n    q = str(query or \"\").strip()\n\n    pii_phrases = (\n        \"我的学号是\", \"我的身份证号是\", \"我的手机号是\", \"请保存我的个人信息\",\n        \"保存我的聊天记录\", \"我的隐私安全吗\", \"会保存聊天记录吗\", \"隐私政策\",\n    )\n    pii_patterns = (\n        r\"(?<!\\d)1[3-9]\\d{9}(?!\\d)\",\n        r\"(?<!\\d)[1-9]\\d{5}(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])\\d{3}[0-9Xx](?!\\w)\",\n        r\"(?i)(?<![A-Z0-9._%+-])[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}(?![A-Z0-9_])\",\n        r\"(?:学号|工号)\\s*[:：是为]?\\s*[A-Za-z0-9_-]{6,24}\",\n        r\"(?:身份证号?|身份证号码|手机号|手机号码|联系电话|电话号码|QQ号?|微信号|账号|密码|验证码)\\s*[:：是为]?\\s*[A-Za-z0-9_@+ .-]{4,40}\",\n    )\n    image_terms = (\n        \"上传图片\", \"上传照片\", \"发照片\", \"发图片\", \"识别图片\", \"看图识别\", \"能看图\",\n        \"发张图\", \"传图片\", \"截图\", \"图片识别\", \"发个图\", \"传个图\", \"看看图\",\n        \"发的图\", \"图帮我\", \"识别一下这张\", \"上传一下\",\n    )\n\n    hard_terms = (\n        \"想死\", \"自杀\", \"不想活\", \"结束生命\", \"伤害自己\", \"割腕\", \"跳楼\", \"吞药\",\n        \"轻生\", \"自残\", \"自伤\",\n    )\n    soft_terms = (\n        \"撑不下去\", \"活着没意义\", \"活不下去\", \"没必要活着\", \"不想醒来\",\n        \"想消失\", \"消失算了\", \"想解脱\", \"想永远睡过去\", \"结束这一切\", \"最后告别\",\n    )\n    violence_terms = (\n        \"伤害别人\", \"伤害他人\", \"杀人\", \"杀了他\", \"杀了她\", \"弄死他\", \"弄死她\",\n        \"砍人\", \"捅人\", \"报复他\", \"报复她\", \"打死他\", \"打死她\", \"对他动手\", \"对她动手\",\n    )\n    self_terms = (\n        \"我想死\", \"我要死\", \"我想自杀\", \"我不想活\", \"我准备自杀\", \"我准备跳楼\",\n        \"我准备割腕\", \"我无法保证自己安全\", \"我控制不住伤害自己\", \"我已经割腕\",\n        \"我已经吞药\", \"我已经吃了很多药\", \"我吃了很多药\", \"我吃了一整瓶\",\n        \"我吃了一把药\", \"我总想死\", \"我经常想死\", \"我每天都想死\", \"我有自杀的想法\",\n        \"我也不想活\", \"我也想死\", \"我也想自杀\",\n    )\n    self_concurrent = (\n        \"我也想\", \"我也想死\", \"我也想自杀\", \"我也想不开\", \"我也想结束\", \"我也想消失\",\n        \"我也想解脱\", \"我也是这样想\", \"我也有这种想法\", \"我也经常这样想\", \"我和他都\",\n        \"我和她都\", \"我自己也\",\n    )\n    explicit_negations = (\n        \"我不想死\", \"我不会自杀\", \"我没有自杀想法\", \"我没想过自杀\", \"我没想自杀\",\n        \"我不会伤害自己\", \"我不想伤害自己\", \"我没这个想法\",\n    )\n    strong_self_evidence = (\n        \"我控制不住伤害自己\", \"我已经割腕\", \"我已经吞药\", \"我已经吃了很多药\",\n        \"我无法保证自己安全\", \"我控制不住\",\n    )\n    info_markers = (\n        \"新闻\", \"报道\", \"课程\", \"小说\", \"电影\", \"是什么意思\", \"这个词\", \"这句话\",\n        \"科普\", \"举例\", \"论文\", \"数据\", \"统计\",\n    )\n    other_markers = (\n        \"朋友\", \"同学\", \"室友\", \"舍友\", \"家人\", \"同桌\", \"同事\", \"他说\", \"她说\",\n        \"对方\", \"别人\", \"他人\", \"有人\", \"一个人\", \"他最近\", \"她最近\", \"我认识\",\n    )\n    help_verbs = (\n        \"想帮\", \"怎么帮\", \"如何帮\", \"能帮\", \"想关心\", \"想陪伴\", \"想安慰\", \"我该做\", \"该怎么办\",\n    )\n    know_verbs = (\n        \"想知道\", \"想了解\", \"想问\", \"想查\", \"想确认\", \"想学习\", \"想科普\", \"想咨询\", \"想研究\", \"想讨论\",\n    )\n    first_person = (\n        \"我想\", \"我要\", \"我准备\", \"我打算\", \"我已经\", \"我正在\", \"我控制不住\", \"我忍不住\",\n        \"我会\", \"我现在想\", \"我现在要\", \"我一直想\", \"我特别想\", \"我真的很想\", \"我每天都想\",\n        \"我经常想\", \"我总想\", \"我忍不住想\",\n    )\n    idiom_false_positives = (\n        \"死磕\", \"死党\", \"死心\", \"死记硬背\", \"笑死\", \"累死\", \"烦死\", \"死板\", \"死机\",\n        \"死循环\", \"无聊死\", \"拼死\", \"困死\", \"饿死\", \"气死\", \"尴尬死\", \"热死\", \"冷死\", \"死死\",\n    )\n    colloquial_phrases = (\"我要死了这作业\", \"这作业我要死了\", \"我要死了这考试\", \"这考试我要死了\")\n\n    q_scan = q\n    for phrase in colloquial_phrases:\n        q_scan = q_scan.replace(phrase, \"\")\n    for term in idiom_false_positives:\n        q_scan = q_scan.replace(term, \"\")\n    has_idiom = q_scan != q\n    overdose_patterns = (\n        r\"(?:吃|服|吞)(?:了)?[^，。！？!?]{0,12}(?:一整瓶|一把|很多|过量|[1-9]\\d+片)\",\n        r\"(?:药吃多了|服药过量|吃药过量)\",\n    )\n    has_overdose = any(re.search(pattern, q_scan) for pattern in overdose_patterns)\n    has_hard = any(term in q_scan for term in hard_terms) or has_overdose\n    has_soft = any(term in q_scan for term in soft_terms)\n    has_risk = has_hard or has_soft\n    has_violence = any(term in q_scan for term in violence_terms)\n\n    # 对他人实施暴力需要独立处置，不能套用自伤话术。\n    if has_violence:\n        return {\"kind\": \"violence_risk\", \"reason\": \"threat_to_other_person\"}\n\n    q_wo_neg = q_scan\n    for term in explicit_negations:\n        q_wo_neg = q_wo_neg.replace(term, \"\")\n    residual_risk = any(term in q_wo_neg for term in hard_terms + soft_terms)\n    if any(term in q_scan for term in explicit_negations) and not any(term in q_scan for term in strong_self_evidence) and not residual_risk:\n        return {\"kind\": \"none\", \"reason\": \"explicit_self_risk_negation\"}\n\n    immediate_self = has_overdose or any(term in q_scan for term in strong_self_evidence)\n    if immediate_self:\n        return {\"kind\": \"crisis_immediate\", \"reason\": \"action_already_taken_or_uncontrolled\"}\n\n    self_hit = any(term in q_scan for term in self_terms)\n    concurrent_hit = any(term in q_scan for term in self_concurrent)\n    other_hit = any(term in q_scan for term in other_markers)\n    help_hit = any(term in q_scan for term in help_verbs)\n    info_hit = any(term in q_scan for term in info_markers) or any(term in q_scan for term in know_verbs)\n\n    # 明确本人证据永远高于“帮我/怎么办”等求助动词。\n    if self_hit or (has_risk and concurrent_hit):\n        return {\"kind\": \"self_crisis\", \"reason\": \"explicit_self_risk_present\"}\n    if has_risk and info_hit and not other_hit:\n        return {\"kind\": \"crisis_info\", \"reason\": \"quoted_or_informational_context\"}\n    if has_risk and other_hit:\n        return {\"kind\": \"crisis_other\", \"reason\": \"risk_subject_is_other_person\"}\n    if has_risk and any(term in q_scan for term in first_person):\n        return {\"kind\": \"self_crisis\", \"reason\": \"first_person_risk_term\"}\n    # 主体不明的严重/软风险表达按本人风险先确认安全，避免漏报。\n    if has_risk:\n        return {\"kind\": \"self_crisis\", \"reason\": \"ambiguous_risk_safety_first\"}\n\n    # 隐私判断优先于附件，避免文字PII随图片一起进入视觉模型。\n    if any(term in q for term in pii_phrases) or any(re.search(pattern, q) for pattern in pii_patterns):\n        return {\"kind\": \"pii\", \"reason\": \"privacy_or_identifier_submission\"}\n    if files:\n        return {\"kind\": \"image\", \"reason\": \"file_uploaded\"}\n    if any(term in q for term in image_terms):\n        return {\"kind\": \"image\", \"reason\": \"image_capability_question\"}\n    if has_idiom:\n        return {\"kind\": \"none\", \"reason\": \"idiom_or_colloquial_false_positive\"}\n    return {\"kind\": \"none\", \"reason\": \"no_deterministic_prefilter_match\"}\n"
        variables:
        - variable: query
          value_selector:
          - '1785506775822'
          - sys.query
