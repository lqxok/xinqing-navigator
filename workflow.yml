    - data:
        code: "def main(query: str, step: str, scores: str, existing_level: str) -> dict:\n    questions = [\n        \"过去两周，你感到紧张、焦虑或烦躁的频率是？\",\n        \"过去两周，你无法停止或控制担忧的频率是？\",\n        \"过去两周，你对各种事情担忧过多的频率是？\",\n        \"过去两周，你很难放松下来的频率是？\",\n        \"过去两周，你因为不安而难以静坐的频率是？\",\n        \"过去两周，你变得容易烦恼或急躁的频率是？\",\n        \"过去两周，你感到害怕，仿佛将有可怕事情发生的频率是？\",\n    ]\n    options = \"请回复：0 完全没有｜1 有几天｜2 一半以上天数｜3 几乎每天\"\n    impact_question = \"补充题（不计入总分）：这些问题给你的学习、生活或人际交往造成了多大困难？\\n请回复：0 没有困难｜1 有些困难｜2 很困难｜3 极其困难\"\n    q = (query or \"\").strip()\n    try:\n        current_step = int(step or \"0\")\n    except Exception:\n        current_step = 0\n    saved = [x for x in (scores or \"\").split(\",\") if x in (\"0\", \"1\", \"2\", \"3\")]\n    expected = 7 if current_step == 8 else max(current_step - 1, 0)\n    if current_step < 0 or current_step > 8 or len(saved) != expected:\n        current_step, saved = 0, []\n\n    if current_step == 0:\n        return {\"result\": \"这是一个过去两周焦虑感受的7题筛查，不是医学诊断。我会一次问一题，你可回复‘上一题’‘重新开始’或‘退出’。\\n\\n第1/7题：\" + questions[0] + \"\\n\" + options, \"step\": \"1\", \"scores\": \"\", \"level\": existing_level or \"\"}\n    if any(word in q for word in (\"重新开始\", \"从头开始\", \"重来\")):\n        return {\"result\": \"已重新开始GAD-7。\\n\\n第1/7题：\" + questions[0] + \"\\n\" + options, \"step\": \"1\", \"scores\": \"\", \"level\": existing_level or \"\"}\n    if any(word in q for word in (\"退出\", \"取消\", \"不做了\", \"停止测试\", \"结束测试\")):\n        return {\"result\": \"好的，已退出本次GAD-7自测，之前未完成的答案不会用于计分。\", \"step\": \"0\", \"scores\": \"\", \"level\": existing_level or \"\"}\n\n    normalized = q.replace(\" \", \"\").replace(\"。\", \"\").replace(\"，\", \"\")\n    if normalized in (\"查看答案\", \"查看已记录答案\", \"查看已记录的答案\"):\n        shown = \"、\".join(f\"第{i + 1}题={value}\" for i, value in enumerate(saved)) or \"暂时还没有已记录的答案\"\n        current_prompt = impact_question if current_step == 8 else f\"第{current_step}/7题：{questions[current_step - 1]}\\n{options}\"\n        return {\"result\": f\"当前记录：{shown}。\\n\\n{current_prompt}\", \"step\": str(current_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n    if normalized in (\"上一题\", \"返回上一题\", \"回到上一题\"):\n        if current_step == 1:\n            return {\"result\": \"现在已经是第1题。\\n\\n第1/7题：\" + questions[0] + \"\\n\" + options, \"step\": \"1\", \"scores\": \"\", \"level\": existing_level or \"\"}\n        saved.pop()\n        previous_step = 7 if current_step == 8 else current_step - 1\n        return {\"result\": f\"已返回上一题，原答案已撤销。\\n\\n第{previous_step}/7题：{questions[previous_step - 1]}\\n{options}\", \"step\": str(previous_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n\n    change_value = None\n    for prefix in (\"上一题改成\", \"上一题改为\", \"上一题改\", \"把上一题改成\", \"把上一题改为\", \"把上一题改\"):\n        if normalized.startswith(prefix):\n            candidate = normalized[len(prefix):]\n            if candidate in (\"0\", \"1\", \"2\", \"3\"):\n                change_value = candidate\n            break\n    if change_value is not None:\n        if not saved:\n            return {\"result\": \"还没有上一题答案可以修改。\", \"step\": str(current_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n        saved[-1] = change_value\n        current_prompt = impact_question if current_step == 8 else f\"第{current_step}/7题：{questions[current_step - 1]}\\n{options}\"\n        return {\"result\": f\"已把上一题改为 {change_value}。\\n\\n{current_prompt}\", \"step\": str(current_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n\n    if current_step == 8:\n        impact_map = {\"0\": \"没有困难\", \"没有困难\": \"没有困难\", \"1\": \"有些困难\", \"有些困难\": \"有些困难\", \"2\": \"很困难\", \"很困难\": \"很困难\", \"3\": \"极其困难\", \"极其困难\": \"极其困难\"}\n        impact = impact_map.get(normalized)\n        if impact is None:\n            return {\"result\": \"这个回答不在0-3的选项中，补充题不会跳过。\\n\\n\" + impact_question, \"step\": \"8\", \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n        total = sum(int(x) for x in saved)\n        if total <= 4:\n            level, advice = \"无或极轻微\", \"本量表显示的焦虑症状较少；如果你仍明显痛苦或生活受影响，也可以寻求专业支持。\"\n        elif total <= 9:\n            level, advice = \"轻度\", \"可以尝试规律睡眠、适量活动和放松练习；若持续困扰，可预约心理咨询。\"\n        elif total <= 14:\n            level, advice = \"中度\", \"建议预约学校心理咨询，与专业人员进一步聊聊近期影响。\"\n        else:\n            level, advice = \"重度\", \"建议尽快联系学校心理中心或其他专业机构进一步评估。\"\n        text = f\"本次GAD-7总分为 {total}/21，属于{level}范围。你报告这些问题造成的困难程度为：{impact}。{advice}\\n\\n这个结果只用于筛查，不能替代诊断。如果你现在无法保证安全，请立即联系可信任的人，并拨打12356、120或110。\"\n        return {\"result\": text, \"step\": \"0\", \"scores\": \"\", \"level\": level}\n\n    mapping = {\"0\": 0, \"完全没有\": 0, \"从来没有\": 0, \"没有\": 0, \"从不\": 0, \"1\": 1, \"有几天\": 1, \"偶尔\": 1, \"很少\": 1, \"2\": 2, \"一半以上\": 2, \"一半以上天数\": 2, \"超过一半\": 2, \"经常\": 2, \"3\": 3, \"几乎每天\": 3, \"每天\": 3, \"总是\": 3}\n    score = mapping.get(normalized)\n    if score is None:\n        return {\"result\": f\"这个回答不在0-3的选项中，本题不会跳过。\\n\\n第{current_step}/7题：{questions[current_step - 1]}\\n{options}\", \"step\": str(current_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n    saved.append(str(score))\n    if current_step < 7:\n        next_step = current_step + 1\n        return {\"result\": f\"已记录。\\n\\n第{next_step}/7题：{questions[next_step - 1]}\\n{options}\", \"step\": str(next_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n    return {\"result\": \"7道计分题已完成。\\n\\n\" + impact_question, \"step\": \"8\", \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n"
        code_language: python3
