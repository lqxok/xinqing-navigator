        code: "import re\n\ndef main(model_intent: str, query: str, gad7_step: str, personality_step: str, light_step: str, risk_pending: str) -> dict:\n    q = str(query or \"\").strip()\n    compact = \"\".join(q.split()).replace(\"。\", \"\").replace(\"！\", \"\").replace(\"!\", \"\")\n    allowed_model = (\"violence_risk\", \"crisis_immediate\", \"crisis_high_risk\", \"crisis_for_other\", \"distress\", \"gad7_test\", \"personality_test\", \"campus_service\", \"teacher_query\", \"light_assess\")\n    raw_model = str(model_intent or \"\").strip()\n    model = next((label for label in allowed_model if re.search(r\"(?<![A-Za-z_])\" + re.escape(label) + r\"(?![A-Za-z_])\", raw_model)), \"\")\n\n    safe_answers = {\"安全\", \"我安全\", \"现在安全\", \"目前安全\", \"能保证安全\", \"我能保证安全\"}\n    unsafe_answers = {\"不安全\", \"现在不安全\", \"目前不安全\", \"不能保证安全\", \"我不能保证安全\", \"控制不住\", \"有具体计划\"}\n    if compact in unsafe_answers:\n        return {\"intent\": \"crisis_immediate\", \"reason\": \"explicit_unsafe_reply\"}\n    if compact in safe_answers and str(risk_pending or \"0\") == \"1\":\n        return {\"intent\": \"crisis_safe\", \"reason\": \"pending_risk_confirmed_safe\"}\n\n    hard_terms = (\"想死\", \"自杀\", \"不想活\", \"结束生命\", \"伤害自己\", \"割腕\", \"跳楼\", \"吞药\", \"轻生\", \"自残\", \"自伤\")\n    soft_terms = (\"撑不下去\", \"活着没意义\", \"活不下去\", \"没必要活着\", \"不想醒来\", \"想消失\", \"消失算了\", \"想解脱\", \"想永远睡过去\", \"结束这一切\", \"最后告别\")\n    violence_terms = (\"伤害别人\", \"伤害他人\", \"杀人\", \"杀了他\", \"杀了她\", \"弄死他\", \"弄死她\", \"砍人\", \"捅人\", \"报复他\", \"报复她\", \"打死他\", \"打死她\", \"对他动手\", \"对她动手\")\n    self_terms = (\"我想死\", \"我要死\", \"我想自杀\", \"我不想活\", \"我准备自杀\", \"我准备跳楼\", \"我准备割腕\", \"我无法保证自己安全\", \"我控制不住伤害自己\", \"我已经割腕\", \"我已经吞药\", \"我已经吃了很多药\", \"我吃了很多药\", \"我吃了一整瓶\", \"我吃了一把药\", \"我总想死\", \"我经常想死\", \"我每天都想死\", \"我有自杀的想法\", \"我也不想活\", \"我也想死\", \"我也想自杀\")\n    explicit_negations = (\"我不想死\", \"我不会自杀\", \"我没有自杀想法\", \"我没想过自杀\", \"我没想自杀\", \"我不会伤害自己\", \"我不想伤害自己\", \"我没这个想法\")\n    other_markers = (\"朋友\", \"同学\", \"室友\", \"舍友\", \"家人\", \"同桌\", \"同事\", \"他说\", \"她说\", \"对方\", \"别人\", \"他人\", \"有人\", \"一个人\", \"他最近\", \"她最近\", \"我认识\")\n    info_markers = (\"新闻\", \"报道\", \"课程\", \"小说\", \"电影\", \"是什么意思\", \"这个词\", \"这句话\", \"科普\", \"举例\", \"论文\", \"数据\", \"统计\", \"想知道\", \"想了解\", \"想学习\", \"想研究\")\n    idiom_false_positives = (\"死磕\", \"死党\", \"死心\", \"死记硬背\", \"笑死\", \"累死\", \"烦死\", \"死板\", \"死机\", \"死循环\", \"无聊死\", \"拼死\", \"困死\", \"饿死\", \"气死\", \"尴尬死\", \"热死\", \"冷死\", \"死死\")\n    colloquial_phrases = (\"我要死了这作业\", \"这作业我要死了\", \"我要死了这考试\", \"这考试我要死了\")\n    q_scan = q\n    for phrase in colloquial_phrases:\n        q_scan = q_scan.replace(phrase, \"\")\n    for term in idiom_false_positives:\n        q_scan = q_scan.replace(term, \"\")\n\n    if any(term in q_scan for term in violence_terms):\n        return {\"intent\": \"violence_risk\", \"reason\": \"threat_to_other_person\"}\n    q_wo_neg = q_scan\n    for term in explicit_negations:\n        q_wo_neg = q_wo_neg.replace(term, \"\")\n    if any(term in q_scan for term in explicit_negations) and not any(term in q_wo_neg for term in hard_terms + soft_terms):\n        return {\"intent\": \"distress\", \"reason\": \"explicit_self_risk_negation\"}\n    overdose = bool(re.search(r\"(?:吃|服|吞)(?:了)?[^，。！？!?]{0,12}(?:一整瓶|一把|很多|过量|[1-9]\\d+片)|(?:药吃多了|服药过量|吃药过量)\", q_scan))\n    implemented_terms = (\"我已经割腕\", \"我已经吞药\", \"我已经吃了很多药\", \"我无法保证自己安全\", \"我控制不住\")\n    has_risk = any(term in q_scan for term in hard_terms + soft_terms) or overdose\n    if overdose or any(term in q_scan for term in implemented_terms):\n        return {\"intent\": \"crisis_immediate\", \"reason\": \"action_already_taken_or_uncontrolled\"}\n    if any(term in q_scan for term in self_terms):\n        return {\"intent\": \"crisis_immediate\", \"reason\": \"explicit_self_risk_present\"}\n    if has_risk and any(term in q_scan for term in info_markers) and not any(term in q_scan for term in other_markers):\n        return {\"intent\": \"crisis_term_info\", \"reason\": \"quoted_or_informational\"}\n    if has_risk and any(term in q_scan for term in other_markers):\n        return {\"intent\": \"crisis_for_other\", \"reason\": \"risk_concerns_other_person\"}\n    if has_risk:\n        return {\"intent\": \"crisis_high_risk\", \"reason\": \"ambiguous_risk_safety_first\"}\n\n    ordinary_medication = (\"我吃药了\", \"吃药了\", \"我在吃药\", \"我按医嘱吃药了\", \"刚吃完药\")\n    overdose_markers = (\"很多\", \"过量\", \"一整瓶\", \"一把\", \"故意\", \"自杀\", \"不想活\", \"不安全\")\n    if any(term in q for term in ordinary_medication) and not any(term in q for term in overdose_markers):\n        return {\"intent\": \"medication_clarify\", \"reason\": \"ordinary_or_ambiguous_medication_statement\"}\n    if model in (\"violence_risk\", \"crisis_immediate\", \"crisis_high_risk\", \"crisis_for_other\"):\n        return {\"intent\": model, \"reason\": \"model_crisis_preserved\"}\n    if str(gad7_step or \"0\") != \"0\":\n        return {\"intent\": \"gad7_test\", \"reason\": \"active_gad7_locked\"}\n    if str(personality_step or \"0\") != \"0\":\n        return {\"intent\": \"personality_test\", \"reason\": \"active_personality_locked\"}\n    if str(light_step or \"0\") != \"0\":\n        return {\"intent\": \"light_assess\", \"reason\": \"active_light_checkin_locked\"}\n    allowed = {\"distress\", \"gad7_test\", \"personality_test\", \"campus_service\", \"teacher_query\", \"light_assess\"}\n    return {\"intent\": model if model in allowed else \"distress\", \"reason\": \"model_or_safe_fallback\"}\n"
        variables:
