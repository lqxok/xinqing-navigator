        code: "def main(query: str, current_step: str, answers: str, current_count: str) -> dict:\n    q = (query or \"\").strip()\n    try:\n        step = int(current_step or \"0\")\n    except Exception:\n        step = 0\n    try:\n        count = max(int(current_count or \"0\"), 0)\n    except Exception:\n        count = 0\n    saved = (answers or \"\").split(\"|||\") if answers else []\n    if step < 0 or step > 3 or len(saved) != max(step - 1, 0):\n        step, saved = 0, []\n\n    if step == 0:\n        return {\"result\": f\"我们做一个3题快速心情打卡吧。当前累计完成 {count} 次；完成全部3题后才会增加次数。\\n\\n第1/3题：你现在的情绪温度是多少？请回复0-10分，0表示非常低落，10表示状态很好。\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n\n    if any(word in q for word in (\"重新开始\", \"从头开始\", \"重来\")):\n        return {\"result\": f\"已重新开始本次心情打卡。当前累计完成 {count} 次；完成全部3题后才会增加次数。\\n\\n第1/3题：你现在的情绪温度是多少？请回复0-10分。\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n    if any(word in q for word in (\"退出\", \"取消\", \"不做了\", \"停止打卡\", \"结束打卡\")):\n        return {\"result\": f\"好的，已退出本次心情打卡。本次未完成，因此不计入次数；当前累计完成 {count} 次。\", \"step\": \"0\", \"answers\": \"\", \"count\": str(count)}\n\n    normalized = q.replace(\" \", \"\").replace(\"。\", \"\").replace(\"，\", \"\")\n    if normalized in (\"查看答案\", \"查看已记录答案\", \"查看已记录的答案\"):\n        labels = (\"情绪温度\", \"在意的事情\")\n        shown = \"；\".join(f\"{labels[i]}={value}\" for i, value in enumerate(saved[:2])) or \"暂时还没有已记录的答案\"\n        question = \"最近有什么事情让你比较在意？\" if step == 2 else \"今天有没有什么小事让你感觉好一点？\"\n        return {\"result\": f\"当前记录：{shown}。\\n\\n第{step}/3题：{question}\", \"step\": str(step), \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    if normalized in (\"上一题\", \"返回上一题\", \"回到上一题\"):\n        if step == 1:\n            return {\"result\": \"现在已经是第1题。\\n\\n第1/3题：你现在的情绪温度是多少？请回复0-10分。\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n        saved.pop()\n        previous_step = step - 1\n        previous_question = \"你现在的情绪温度是多少？请回复0-10分。\" if previous_step == 1 else \"最近有什么事情让你比较在意？\"\n        return {\"result\": f\"已返回上一题，原答案已撤销。\\n\\n第{previous_step}/3题：{previous_question}\", \"step\": str(previous_step), \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    change_value = None\n    for prefix in (\"上一题改成\", \"上一题改为\", \"上一题改\", \"把上一题改成\", \"把上一题改为\", \"把上一题改\"):\n        if normalized.startswith(prefix):\n            change_value = normalized[len(prefix):]\n            break\n    if change_value:\n        if not saved:\n            return {\"result\": \"还没有上一题答案可以修改。\", \"step\": str(step), \"answers\": \"|||\".join(saved), \"count\": str(count)}\n        if step == 2:\n            try:\n                mood_value = int(change_value)\n            except Exception:\n                mood_value = -1\n            if not 0 <= mood_value <= 10:\n                return {\"result\": \"上一题是情绪温度，请把它改为0到10之间的整数。\\n\\n第2/3题：最近有什么事情让你比较在意？\", \"step\": \"2\", \"answers\": \"|||\".join(saved), \"count\": str(count)}\n            saved[-1] = str(mood_value)\n        else:\n            saved[-1] = change_value.replace(\"|||\", \"｜\")[:300]\n        question = \"最近有什么事情让你比较在意？\" if step == 2 else \"今天有没有什么小事让你感觉好一点？\"\n        return {\"result\": f\"已把上一题改为“{saved[-1]}”。\\n\\n第{step}/3题：{question}\", \"step\": str(step), \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    if step == 1:\n        mood_in = None\n        if \"_\" not in q:\n            try:\n                mood_in = int(q)\n            except Exception:\n                mood_in = None\n        if mood_in is None or not 0 <= mood_in <= 10:\n            return {\"result\": \"请输入0到10之间的整数。例如：6。\\n\\n第1/3题：你现在的情绪温度是多少？\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n        saved = [str(mood_in)]\n        return {\"result\": \"已记录。\\n\\n第2/3题：最近有什么事情让你比较在意？\", \"step\": \"2\", \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    clean = q.replace(\"|||\", \"｜\")[:300]\n    if not clean:\n        question = \"最近有什么事情让你比较在意？\" if step == 2 else \"今天有没有什么小事让你感觉好一点？\"\n        return {\"result\": f\"可以简单说一句就好。\\n\\n第{step}/3题：{question}\", \"step\": str(step), \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    if step == 2:\n        saved.append(clean)\n        return {\"result\": \"谢谢你告诉我。\\n\\n第3/3题：今天有没有什么小事让你感觉好一点？如果暂时没有，也可以直接说“没有”。\", \"step\": \"3\", \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    mood = None\n    first = saved[0] if saved else \"\"\n    if \"_\" not in first:\n        try:\n            mood = int(first)\n        except Exception:\n            mood = None\n    if mood is None:\n        return {\"result\": f\"本次打卡的存档有点异常，我们重新开始吧。当前累计完成 {count} 次；完成全部3题后才会增加次数。\\n\\n第1/3题：你现在的情绪温度是多少？请回复0-10分。\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n    concern = saved[1] if len(saved) > 1 else \"\"\n    new_count = count + 1\n    if mood <= 3:\n        advice = \"你今天的状态偏低，先把目标放小一点。如果你此刻不能保证自己安全，请立即联系身边可信任的人并拨打120/110或12356；若目前安全但这种状态持续或影响生活，可以联系学校心理中心。\"\n    elif mood <= 6:\n        advice = \"今天似乎有些消耗，可以给自己安排一个十分钟的放松或散步时间。\"\n    else:\n        advice = \"你今天整体状态还可以，可以留意并延续让自己感觉好一点的小事。\"\n    text = f\"第{new_count}次打卡完成：情绪温度 {mood}/10。你在意的是“{concern}”。{advice}\"\n    return {\"result\": text, \"step\": \"0\", \"answers\": \"\", \"count\": str(new_count)}"
