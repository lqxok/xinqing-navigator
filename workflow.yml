      data:
        type: code
        title: 记忆JSON解析与二次脱敏
        desc: 容错解析记忆JSON，并再次移除个人标识符。
        selected: false
        code: "import json\nimport re\n\ndef main(raw: str, existing_mood: str, existing_issue: str, existing_summary: str) -> dict:\n    def redact(value):\n        text = str(value or \"\")\n        patterns = (\n            r\"(?<!\\d)1[3-9]\\d{9}(?!\\d)\",\n            r\"(?<!\\d)[1-9]\\d{5}(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])\\d{3}[0-9Xx](?!\\w)\",\n            r\"(?i)(?<![A-Z0-9._%+-])[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}(?![A-Z0-9_])\",\n            r\"(?:学号|工号|身份证号?|手机号|联系电话|QQ号?|微信号|账号|密码|验证码)\\s*[:：是为]?\\s*[A-Za-z0-9_@+ .-]{4,40}\",\n        )\n        for pattern in patterns:\n            text = re.sub(pattern, \"[已隐藏个人信息]\", text)\n        return text.strip()\n\n    data = {}\n    text = str(raw or \"\")\n    try:\n        match = re.search(r\"\\{[\\s\\S]*\\}\", text)\n        if match:\n            parsed = json.loads(match.group(0))\n            if isinstance(parsed, dict):\n                data = parsed\n    except Exception:\n        data = {}\n    mood = redact(data.get(\"mood\"))[:20] or redact(existing_mood)[:20]\n    issue = redact(data.get(\"issue\"))[:30] or redact(existing_issue)[:30]\n    summary = redact(data.get(\"summary\"))[:120] or redact(existing_summary)[:120]\n    return {\"mood\": mood, \"issue\": issue, \"summary\": summary}\n"
        code_language: python3
        variables:
        - variable: raw
          value_selector:
          - memory_extract_v2
          - text
          value_type: string
        - variable: existing_mood
          value_selector:
