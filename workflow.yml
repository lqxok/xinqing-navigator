        code: "def main(query: str) -> dict:\n    q = \"\".join((query or \"\").strip().split()).replace(\"。\", \"\").replace(\"！\", \"\").replace(\"!\", \"\")\n    unsafe = {\"不安全\", \"现在不安全\", \"目前不安全\", \"不能保证安全\", \"我不能保证安全\", \"控制不住\", \"有具体计划\"}\n    safe = {\"安全\", \"我安全\", \"现在安全\", \"目前安全\", \"能保证安全\", \"我能保证安全\"}\n    medication_actions = (\"已经吞药\", \"已经吃了很多药\", \"吃了一整瓶\", \"吃了一把药\", \"药吃多了\", \"服药过量\", \"吃药过量\")\n    injury_actions = (\"已经割腕\", \"已经自伤\", \"已经伤害自己\")\n    overdose_count = __import__(\"re\").search(r\"(?:吃|服|吞)(?:了)?[^，。！？!?]{0,12}[1-9]\\d+片\", q)\n    if any(term in q for term in medication_actions) or overdose_count:\n        return {\"result\": \"你已经描述了可能危及生命的服药行为，现在不要等待症状出现，也不要独处。请立即拨打120，并让身边可信任的人马上过来陪你；把药物包装、名称和大致服用时间告诉急救人员，不要自行催吐或继续服用其他药物。如果无法自行求助，请让身边的人代为拨打120；同时远离其他危险物品。\"}\n    if any(term in q for term in injury_actions):\n        return {\"result\": \"你已经描述了实际受伤行为，现在不要独处，也不要继续接触可能伤害自己的物品。请立即拨打120，并让身边可信任的人马上过来陪你；如果正在出血，请按急救调度人员的指示处理并尽快获得现场医疗帮助。如果无法自行求助，请让身边的人代为拨打120。\"}\n    if q in unsafe:\n        return {\"result\": \"谢谢你直接告诉我。现在先不要独处：请立即拨打120或110，并联系一位可信任的人到你身边；离开危险地点，把可能伤害自己的物品交给对方保管。也可以同时拨打12356。此刻请优先执行这些行动，不必继续向我解释细节。\"}\n    if q in safe:\n        return {\"result\": \"谢谢你确认目前安全。我先不重复紧急提示。你愿意的话，可以告诉我刚才发生了什么，或者现在最需要哪种帮助。如果安全状况变化，请立即联系可信任的人并拨打120/110或12356。\"}\n    return {\"result\": \"谢谢你告诉我。请先直接回复：你此刻‘安全’还是‘不安全’？如果不安全、已有具体计划或已经采取行动，请立即拨打120/110，离开危险地点和物品，并请可信任的人到你身边；也可拨打12356。\"}\n"
